<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo de Falhas (Relés)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
        p { color: #7f8c8d; margin-bottom: 25px; text-align: center; }

        /* Container Principal que divide os controles e a personagem */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1200px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            flex: 1;
            min-width: 300px;
        }

        /* Card Moderno da Personagem */
        .character-card {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-top: 4px solid #3498db;
            color: white;
        }

        .character-image-container {
            width: 100%;
            height: 340px;
            overflow: hidden;
            position: relative;
        }

        .character-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.5s ease;
        }

        .character-card:hover .character-image-container img {
            transform: scale(1.05);
        }

        .character-info {
            padding: 20px;
        }

        .character-info h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #ecf0f1;
            letter-spacing: 1px;
        }

        .character-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #bdc3c7;
        }

        /* Cards dos Relés */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid #34495e;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }
        .card h3 { margin: 0 0 20px 0; color: #2c3e50; font-size: 1rem; }
        
        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #bdc3c7;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #e74c3c; } 
        input:checked + .slider:before { transform: translateX(26px); }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                align-items: center;
            }
            .character-card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>

    <h1>Painel de Controle de Falhas</h1>
    <p>Ativação e Desativação de Relés em Tempo Real</p>

    <div class="main-layout">
        <!-- Container onde os relés são injetados via JavaScript -->
        <div class="grid-container" id="painel-reles"></div>

        <!-- Painel Lateral Moderno com a Rei Ayanami -->
        <div class="character-card">
            <div class="character-image-container">
                <!-- Imagem temática de alta qualidade da Rei Ayanami -->
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop" alt="Rei Ayanami Aesthetic">
            </div>
            <div class="character-info">
                <h3>REI AYANAMI</h3>
                <p>System Status: Online</p>
            </div>
        </div>
    </div>

    <script>
        const databaseURL = "https://painel-wi-fi-default-rtdb.firebaseio.com";
        const container = document.getElementById('painel-reles');
        const totalReles = 8;

        // Cria os botões na tela automaticamente
        for (let i = 1; i <= totalReles; i++) {
            const defectKey = `DEFEITO${i}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>Relé ${i} (${defectKey})</h3>
                <label class="switch">
                    <input type="checkbox" id="${defectKey}" onchange="atualizarFirebase('${defectKey}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }

        // Envia o estado atualizado via requisição HTTP PUT
        function atualizarFirebase(chave, status) {
            fetch(`${databaseURL}/${chave}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(status)
            })
            .then(res => {
                if (!res.ok) throw new Error("Erro na resposta do servidor");
                return res.json();
            })
            .then(data => console.log(`Atualizado ${chave}:`, data))
            .catch(error => console.error("Erro ao enviar comando:", error));
        }

        // Busca todos os estados de uma vez só na raiz do banco de dados
        function buscarEstadosIniciais() {
            fetch(`${databaseURL}/.json`)
                .then(res => {
                    if (!res.ok) throw new Error("Erro ao conectar com o Firebase");
                    return res.json();
                })
                .then(dados => {
                    if (!dados) return;
                    for (let i = 1; i <= totalReles; i++) {
                        const defectKey = `DEFEITO${i}`;
                        const checkbox = document.getElementById(defectKey);
                        if (checkbox && dados[defectKey] !== undefined) {
                            const valor = dados[defectKey];
                            checkbox.checked = (valor === true || valor === 1 || valor === "true");
                        }
                    }
                })
                .catch(err => console.log("Aguardando resposta ou sem dados no Firebase..."));
        }

        // Sincroniza ao abrir e repete a cada 3 segundos
        buscarEstadosIniciais();
        setInterval(buscarEstadosIniciais, 3000);
    </script>
</body>
</html>
