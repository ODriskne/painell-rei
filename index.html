    <title>Painel de Controle - Rei Ayanami</title>
    <!-- Importando fontes: Serif estilo Evangelion (Cinzel/Playfair) + Orbitron + Inter -->

        }

        body {

        }

        p {

            margin: 0; 
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: stretch;
            justify-content: center;
        }
