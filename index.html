<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo de Falhas (Relés)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        /* Container principal dividindo personagem e painel */
        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Estilo da área do personagem */
        .character-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .character-container img {
            width: 220px;
            height: auto;
            max-height: 380px;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 0; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            flex: 1;
            min-width: 300px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid #34495e;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin: 0 0 20px 0; color: #2c3e50; font-size: 16px; }
        
        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #bdc3c7;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #e74c3c; } 
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Painel de Controle de Falhas</h1>
        <p>Ativação e Desativação de Relés em Tempo Real</p>
    </div>

    <div class="main-layout">
        <!-- ÁREA DA REI AYANAMI (Você pode trocar o link da imagem no src se preferir outra pose) -->
        <div class="character-container">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400" alt="Rei Ayanami">
        </div>

        <!-- GRID DOS RELÉS -->
        <div class="grid-container" id="painel-reles">
            <!-- Os botões serão injetados aqui via script -->
        </div>
    </div>

    <script>
        const databaseURL = "https://painel-wi-fi-default-rtdb.firebaseio.com";
        const container = document.getElementById('painel-reles');
        const totalReles = 8;

        // Cria os botões na tela automaticamente
        for (let i = 1; i <= totalReles; i++) {
            const defectKey = `DEFEITO${i}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>Relé ${i} (${defectKey})</h3>
                <label class="switch">
                    <input type="checkbox" id="${defectKey}" onchange="atualizarFirebase('${defectKey}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }

        // Envia o estado atualizado via requisição HTTP PUT
        function atualizarFirebase(chave, status) {
            fetch(`${databaseURL}/${chave}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(status)
            })
            .then(res => {
                if (!res.ok) throw new Error("Erro na resposta do servidor");
                return res.json();
            })
            .then(data => console.log(`Atualizado ${chave}:`, data))
            .catch(error => console.error("Erro ao enviar comando:", error));
        }

        // Busca todos os estados de uma vez só na raiz do banco de dados
        function buscarEstadosIniciais() {
            fetch(`${databaseURL}/.json`)
                .then(res => {
                    if (!res.ok) throw new Error("Erro ao conectar com o Firebase");
                    return res.json();
                })
                .then(dados => {
                    if (!dados) return;
                    for (let i = 1; i <= totalReles; i++) {
                        const defectKey = `DEFEITO${i}`;
                        const checkbox = document.getElementById(defectKey);
                        if (checkbox && dados[defectKey] !== undefined) {
                            const valor = dados[defectKey];
                            checkbox.checked = (valor === true || valor === 1 || valor === "true");
                        }
                    }
                })
                .catch(err => console.log("Aguardando resposta ou sem dados no Firebase..."));
        }

        // Sincroniza ao abrir e repete a cada 3 segundos
        buscarEstadosIniciais();
        setInterval(buscarEstadosIniciais, 3000);
    </script>
</body>
</html>
